# Lets the server's API use an NVIDIA GPU. Set YARDLENS_VARIANT=cuda in .env and install the
# NVIDIA Container Toolkit, then:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  api:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
