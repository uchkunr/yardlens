# Builds the Docker images and publishes them to GitHub's container registry for a release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# ghcr.io/<owner>/yardlens:<version>       the API (which also processes the cameras)
# ghcr.io/<owner>/yardlens-web:<version>   the dashboard
#
# The tag must match the version in apps/api/pyproject.toml. Make the packages public once
# (Package settings > Change visibility) so they can be pulled without logging in.
name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/api/pyproject.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version in pyproject.toml" >&2
            exit 1
          fi

  api:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: names
        name: Image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yardlens" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ steps.names.outputs.image }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  web:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: names
        name: Image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yardlens-web" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ steps.names.outputs.image }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
